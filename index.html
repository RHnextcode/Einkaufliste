<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einkaufsliste</title>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>
    <div class="container">
        <h1>Grocery-list app</h1>
        <p class="alert"></p>
        
        <!-- Formular -->
        <form class="grocery-form" autocomplete=“off”>
            <input type="text" id="grocery" placeholder="Add Item..." autocomplete=“off” readonly onfocus="this.removeAttribute('readonly')">

            <button type="submit" id="submit-btn">Add</button>
        </form>

        <!-- Einkaufsliste Container -->
        <div class="grocery-container">
            <ul class="grocery-list"></ul>
            <button class="clear-btn">clear Item</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
